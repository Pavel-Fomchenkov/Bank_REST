server:
  port: 8080

spring:
  application:
    name: Bank_REST
  datasource:
    url: jdbc:postgresql://localhost:5432/bankcards
    username: bankcards_admin
    password: passwd
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  liquibase:
    enabled: false
    change-log: classpath:db/migration/changelog-master.yml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO

